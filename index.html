<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>William Duchene — Réalisateur Vidéo</title>

  <meta name="description" content="William Duchene — Réalisateur vidéo : captations, bandes-annonces, clips, interviews." />

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header class="topbar">
  <div class="logo">WILLIAM DUCHENE</div>

  <nav class="nav">
    <a href="#projects">Projets</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <iframe
    id="heroPlayer"
    class="hero-video"
    src="https://www.youtube.com/embed/G3zP-RhcgAE?autoplay=1&mute=1&controls=0&loop=1&playlist=G3zP-RhcgAE&rel=0"
    allow="autoplay; encrypted-media"
    allowfullscreen
  ></iframe>

  <div class="hero-text">
    <h1>William Duchene</h1>
    <p>Réalisateur Vidéo — Captation, Bandes Annonce, Musique & Documentaire</p>

    <button class="btn" id="unmuteBtn">Activer le son</button>
  </div>
</section>

<!-- FEATURED -->
<section class="section featured" id="projects">

  <div class="section-inner">

    <h2>SELECTION</h2>

    <div class="featured-row" id="featuredRow"></div>

  </div>

</section>

<!-- CATALOGUE -->
<section class="section catalog">

  <div class="section-inner">

    <h2>Catalogue</h2>

    <!-- FILTERS -->
    <div class="filters">
      <button class="filter active" data-filter="all">Tout</button>
      <button class="filter" data-filter="vision">Vision</button>
      <button class="filter" data-filter="bandes_annonces">Bandes annonces</button>
      <button class="filter" data-filter="captations">Captations</button>
      <button class="filter" data-filter="musique">Musique</button>
      <button class="filter" data-filter="interviews_reportages">Interviews</button>
    </div>

    <!-- GRID -->
    <div class="grid" id="grid"></div>

    <div style="text-align:center;margin-top:30px;">
      <button class="btn btn-outline" id="loadMoreBtn">Charger plus</button>
    </div>

  </div>

</section>

<!-- CONTACT -->
<section class="section contact" id="contact">

  <div class="section-inner">

    <h2>Contact</h2>

    <p style="opacity:0.7;">Pour collaboration ou projet :</p>

    <a href="mailto:willduchene@gmail.com" style="color:white;font-size:18px;">
      willduchene@gmail.com
    </a>

    <p style="margin-top:40px;opacity:0.4;font-size:12px;">
      © William Duchene
    </p>

  </div>

</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="closeBtn">✕</button>

  <iframe id="player" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>

<script src="script.js"></script>

</body>
</html>
